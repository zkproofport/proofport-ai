# Compose override that switches payment ON, so the paid path can be exercised
# locally without rebuilding the image.
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e-payment.yml up -d ai
#
# Offers both staging chains, so one run covers a facilitator-settled chain
# (Base Sepolia) and one this service settles itself (Ethereum Sepolia). $0.01 rather than $0.10 -- cheap enough to run repeatedly, which is
# the only way the paid path actually gets exercised.
#
# PROVER_PRIVATE_KEY must come from the environment: the service
# refuses to start without it while a self-settled chain is offered, and a key
# does not belong in a committed file.
services:
  ai:
    environment:
      PAYMENT_MODE: testnet
      PAYMENT_NETWORKS: "base-sepolia,ethereum-sepolia"
      PAYMENT_PAY_TO: "${PAYMENT_PAY_TO:?set PAYMENT_PAY_TO to the PROVER_PRIVATE_KEY wallet address}"
      PROVER_PRIVATE_KEY: "${PROVER_PRIVATE_KEY:?set PROVER_PRIVATE_KEY to the payee wallet, funded with Sepolia ETH for settlement gas}"
      X402_FACILITATOR_URL: "https://x402.dexter.cash"
      PAYMENT_PROOF_PRICE: "$$0.01"
      ETHEREUM_RPC_URL: "https://ethereum-sepolia-rpc.publicnode.com"
