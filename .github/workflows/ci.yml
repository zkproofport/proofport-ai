name: CI

# Runs the checks that were previously run only by hand. Until this existed,
# .github/workflows/ held only npm-publish.yml and release-please.yml, neither of
# which runs a test — which is how 38 unit tests stayed red on main unnoticed.
#
# Everything here calls a script that already exists in the repo, so a developer
# reproduces CI by running the same npm scripts locally.
#
# Live E2E runs separately against an explicitly selected service with funded
# payment wallets. GCP staging is active; unit CI must not consume customer
# credentials or count omitted paid proofs as passes.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proofport-ai
    steps:
      # Checked out into a SUBDIRECTORY, so every step below runs from
      # proofport-ai/. The canonical circuit ids and the EIP-712 action check
      # come from the npm package @zkproofport-app/core; no sibling checkout of
      # proofport-app-sdk is needed.
      - name: Checkout proofport-ai
        uses: actions/checkout@v4
        with:
          path: proofport-ai

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Resolve the same pinned dependencies used by the publication workflow.
      - name: Install dependencies
        run: npm ci

      # ── packages/sdk ───────────────────────────────────────────────────────
      # Must be BUILT before packages/mcp is built or typechecked: packages/mcp
      # imports @zkproofport-ai/sdk and cannot resolve it until
      # packages/sdk/dist exists. npm-publish.yml relies on the same ordering.
      - name: Typecheck (packages/sdk)
        run: npm run typecheck --workspace @zkproofport-ai/sdk

      - name: Build (packages/sdk)
        run: npm run build --workspace @zkproofport-ai/sdk

      # ── Root server ────────────────────────────────────────────────────────
      - name: Typecheck (root and operational scripts)
        run: npm run typecheck:all

      - name: Build (root)
        run: npm run build

      - name: Unit tests (approval page)
        run: npm run test --workspace @zkproofport-ai/approval-web

      - name: Install approval-page test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (approval page, simulated wallet)
        run: npm run test:browser --workspace @zkproofport-ai/approval-web

      # .env.test is gitignored (it holds real E2E credentials) so it is absent
      # here. tests/setup.ts tolerates a missing file, but tests/inputBuilder.ts
      # hard-fails at import without PROVER_PRIVATE_KEY, so supply it.
      #
      # This is the standard Hardhat/Anvil dev account #0 key — the same value
      # .env.test uses, where it is commented "public, no real funds". It is a
      # deterministic test wallet, NOT a secret, and must never be replaced with
      # a funded key. Every other name in .env.test IS a real credential and
      # belongs in neither this file nor CI; nothing in the unit project needs one.
      - name: Unit tests (root)
        env:
          PROVER_PRIVATE_KEY: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
        run: npm run test:unit

      # ── packages/mcp ───────────────────────────────────────────────────────
      # `build` is `tsc`, so this typechecks packages/mcp as well as emitting.
      - name: Build (packages/mcp)
        run: npm run build --workspace @zkproofport-ai/mcp

      - name: Unit tests (packages/mcp)
        run: npm run test:unit --workspace @zkproofport-ai/mcp
