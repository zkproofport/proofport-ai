name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing Release Please tag to publish or retry (sdk-v… / mcp-v…)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

# Only run for npm packages (sdk, mcp). Server releases deploy through the parent deploy-ai.yml (GCP).

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Determine package from tag
        id: pkg
        run: |
          TAG="$RELEASE_TAG"
          if [[ "$TAG" == sdk-v* ]]; then
            echo "package=packages/sdk" >> "$GITHUB_OUTPUT"
            echo "name=@zkproofport-ai/sdk" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == mcp-v* ]]; then
            echo "package=packages/mcp" >> "$GITHUB_OUTPUT"
            echo "name=@zkproofport-ai/mcp" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping non-npm release: $TAG"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Require an existing published GitHub release
        if: steps.pkg.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json isDraft,publishedAt --jq 'if .isDraft == false and .publishedAt != null then .publishedAt else error("Release must be published by Release Please first") end'

      - name: Verify release tag matches package and manifest
        if: steps.pkg.outputs.skip != 'true'
        env:
          PACKAGE_PATH: ${{ steps.pkg.outputs.package }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = process.env.PACKAGE_PATH;
          const version = JSON.parse(fs.readFileSync(`${path}/package.json`)).version;
          const baseline = JSON.parse(fs.readFileSync('.release-please-manifest.json'))[path];
          if (!process.env.RELEASE_TAG.endsWith(`-v${version}`) || baseline !== version) {
            throw new Error('Release tag, package version and Release Please manifest must agree');
          }
          NODE

      # Human-action clients require the matching approval API on their default
      # production origin. Fail fast; retry this existing release after rollout.
      - name: Require production server readiness
        if: steps.pkg.outputs.skip != 'true'
        run: node scripts/check-npm-release-readiness.mjs

      - name: Install dependencies
        if: steps.pkg.outputs.skip != 'true'
        run: npm ci

      - name: Build SDK (always needed)
        if: steps.pkg.outputs.skip != 'true'
        run: npx tsc -p packages/sdk

      - name: Build MCP (if publishing MCP)
        if: steps.pkg.outputs.skip != 'true' && steps.pkg.outputs.package == 'packages/mcp'
        run: npx tsc -p packages/mcp

      - name: Typecheck
        if: steps.pkg.outputs.skip != 'true'
        run: npx tsc -p ${{ steps.pkg.outputs.package }} --noEmit

      - name: Upgrade npm for OIDC trusted publishing
        if: steps.pkg.outputs.skip != 'true'
        run: npm install -g npm@12.0.2

      - name: Wait for the released SDK dependency
        if: steps.pkg.outputs.skip != 'true' && steps.pkg.outputs.package == 'packages/mcp'
        run: |
          SDK_VERSION=$(node -p "require('./packages/sdk/package.json').version")
          for attempt in {1..24}; do
            PUBLISHED=$(npm view "@zkproofport-ai/sdk@$SDK_VERSION" version 2>/dev/null || true)
            if [[ "$PUBLISHED" == "$SDK_VERSION" ]]; then exit 0; fi
            sleep 10
          done
          echo "SDK $SDK_VERSION must be published before MCP can be installed by users"
          exit 1

      - name: Publish to npm (OIDC trusted publisher)
        if: steps.pkg.outputs.skip != 'true'
        working-directory: ${{ steps.pkg.outputs.package }}
        run: |
          TAG="$RELEASE_TAG"
          if [[ "$TAG" == *"beta"* ]]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi
